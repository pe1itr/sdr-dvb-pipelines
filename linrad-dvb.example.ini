# Copy to linrad-dvb.ini before starting; keep your local settings out of Git.
# Paths containing / are relative to this file. Bare names are searched in PATH.
[paths]
knucker=/home/pi/ryde-build/configs/dvbt/CombiTunerExpress
sdr=build/sdr_to_stdout
linrad=build/linrad_udp_to_stdout
# Only used with backend=external; install this program separately.
leandvb=leandvb
cvlc=cvlc
vlc=vlc
ffplay=ffplay
custom_renderer=mpv
ffmpeg=ffmpeg
iq_file=build/iq_file_to_stdout

[linrad]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
ip=127.0.0.1
port=50000
header_bytes=24
sample_rate=1010526
format=s16
# Extra options, e.g. --s16-gain 2 --measure 3200000
# Recording: --record-iq recordings (the GUI keeps stdout enabled).
args=
frequency=0

[leandvb]
backend=embedded
ldpc_mode=soft
# Experimental Linux PI6EHV GPU LDPC, with production CPU fallback/retry.
gpu_ldpc=false
helpers=1
# Automatic DVB-S2: <=333 ksym/s continuous acquisition + low latency;
# higher symbol rates (e.g. PI6EHV 5M 8PSK) normal acquisition + throughput.
latency=auto
acquisition=auto
dvbs_args=--inbuf 262144 --sampler rrc --rrc-steps 8 --fastlock --hq -v
# Acquisition follows the symbol rate; no fixed --fastlock/--hq here.
# Accept normal and short DVB-S2 frames.
dvbs2_args=--sampler rrc --rrc-steps 8 --ldpc-bf 20 --framesizes 3

[rbdvbt_rx]
# DVB-T is compiled into linrad_dvb; these are decoder options, not a program path.
args=--afc --live-symbols 64 --probe-symbols 64 --wait-video-start --loglevel info

[cvlc]
args=--no-one-instance --avcodec-hw=none --demux=ts --file-caching=300 --live-caching=300 --network-caching=300 --clock-jitter=0 --clock-synchro=0 --drop-late-frames --skip-frames --no-fullscreen --zoom=1

[ffplay]
args=-hide_banner -loglevel warning -autoexit -f mpegts

# Direct SDR inputs. Press W in the GUI to save settings for the next start.
[lime]
# Native LimeSuite, original Mini v1.x including v1.2; RX channel 0.
# 100000..30720000 samples/s, 10000000..3500000000 Hz.
sample_rate=10000000
frequency=437000000
# LimeSuite unsigned RX gain scale (0..73, steps of 1).
gain=30
# Empty for one device; otherwise serial=SERIAL (complete serial).
args=
images=
# AUTO: LNAW below 2 GHz, LNAH from 2 GHz. Also accepts LNAW or LNAH.
antenna=AUTO
format=s16
filter_enabled=false
filter_bandwidth=50000
lo_offset=0
receiver_offset=0
tune_step=1000

[hackrf]
# Gain is LNA + VGA, excluding AMP. LNA first; VGA base 12, maximum 24 dB.
gain_policy=lna_first
# Internal RF amplifier: auto follows gain; off/on force the AMP stage.
rf_amp=auto
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
sample_rate=10000000
frequency=437000000
gain=44
format=u8
args=driver=hackrf
images=
antenna=

[b210]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
sample_rate=10000000
frequency=437000000
gain=30
format=s16
args=
# Empty: use the installed UHD images or UHD_IMAGES_DIR.
images=
antenna=TX/RX

# RTL-SDR R820T/R820T2/R828D via SoapyRTLSDR, normal tuner mode.
[rtlsdr]
sample_rate=2400000
frequency=437000000
gain=30
format=u8
args=driver=rtlsdr
images=
antenna=RX
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# FUNcube Dongle Pro+: native ALSA IQ + hidraw tuner control (no Soapy plugin).
[fcdpp]
sample_rate=192000
frequency=437000000
# IF gain only, 0..59 dB. LNA and mixer are independent switches in args.
gain=20
format=s16
args=lna=1,mixer=1
images=
antenna=
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# RFspace SDR-IQ through SoapyRFSpace; tune to the converter output.
[sdriq]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
sample_rate=111111
frequency=28000000
gain=10
format=s16
args=driver=rfspace,sdr-iq=/dev/ttyUSB0
images=
antenna=

# AFEDRI / AFE822x native TCP control and UDP IQ, single channel (DDC1).
# Example address: replace with your receiver address before using AFEDRI.
[afedri]
ip=192.168.1.100
port=50005
bind=0.0.0.0
sample_rate=1010526
frequency=28000000
# RF gain: -10..35 dB in steps of 3; existing hardware AGC setting is retained.
gain=14
format=s16
lo_offset=0
# DVB channel offset from SDR center (Hz); 0 bypasses digital mixing.
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# SDRplay API v3 + SoapySDRPlay3. RSP1B needs API >= 3.14.
# Select the matching model; optionally append ,serial=SERIAL to args.
# gain is IF reduction: higher values mean LESS gain (20..59 dB).
[rsp1a]
sample_rate=2000000
frequency=144600000
gain=40
args=driver=sdrplay
format=s16
lo_offset=0
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

[rsp1b]
sample_rate=2000000
frequency=144600000
gain=40
args=driver=sdrplay
format=s16
lo_offset=0
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# Dual Port VHF connector only: 64..260 MHz; automatic gain.
# RF display = frequency + lo_offset + receiver_offset (all in Hz).
# Example: 437 MHz via 144 MHz IF -> frequency=144000000, lo_offset=293000000.
[airspyhf]
sample_rate=768000
frequency=144600000
gain=0
args=driver=airspyhf
format=s16
lo_offset=0
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# Airspy R2: SoapyAirspy + libairspy. Standard firmware rates only.
# Gain is an aggregate setting (0..45), not calibrated dB. Bias tee defaults off.
[airspyr2]
sample_rate=10000000
frequency=437000000
gain=30
args=driver=airspy
format=s16
lo_offset=0
receiver_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

# Native libiio, same RX1 backend as atv-receiver-analog.
# Empty args = automatic USB; explicit URI: ip:192.168.2.1 or usb:...
[pluto]
sample_rate=4096000
frequency=437000000
gain=30
args=
images=
antenna=A_BALANCED
format=s16
receiver_offset=0
lo_offset=0
tune_step=1000
filter_enabled=false
filter_bandwidth=50000

[session]
source=linrad
standard=DVB-S
sr=125000
fec=1/2
gi=1/32
constellation=QPSK
scatterfix=false
renderer=embedded

[renderer]
args={input}
output_file=capture.ts
udp_enabled=false
udp_host=127.0.0.1
udp_port=1234

# Repeater output: select --headless --renderer srt (or --srt-output URL).
# Video is transcoded to 1920x1080 with square pixels and black bars as needed.
[srt]
url=srt://44.137.26.85:4001
loss_timeout_ms=2000
retry_interval_ms=2000
fps=25
video_bitrate_kbps=4000
# ODROID-N2 starting point: ultrafast, video_threads=3, filter_threads=1.
# Thread counts apply per decoder/encoder/filter pool, not total CPU usage.
x264_preset=veryfast
video_threads=0
filter_threads=0

[file]
# Select a local IQ recording in the GUI.
path=
input_format=s16
format=s16
sample_rate=250000
header_bytes=0
frequency=0
metadata=
filter_bandwidth=50000
filter_enabled=false

[logging]
# Manual digital reception log; relative to this configuration file.
file=reception-log.csv
# Set via Log -> My Station; copied into each new reception.
my_callsign=
my_locator=

[display]
floor_dbfs_hz=-160
range_db=100
meter_reference_dbfs=-50
meter_range_db=80
meter_seconds_per_point=0.1

# Parallel audio monitor: U = USB (3 kHz), F = FM (12.5 kHz), D = FM-DATA (20 kHz).
# M mutes only speakers; TCI and optional PCM UDP audio continue.
[usb]
tci_bind=127.0.0.1
tci_port=40031
audio_device=default
pcm_udp_enabled=false
pcm_udp_host=127.0.0.1
pcm_udp_port=7355

# DAB Mode-I / DAB+. Use B210 rate 4096000 or RTL-SDR rate 2048000.
# Select standard=DAB and sr=1536000 in [session], or use Mode in the GUI.
[dab]
# Free frequency checkbox in Mode. Off selects the Band III channel below.
free_tuning=false
frequency_hz=227360000
channel=12C
profile=normal
channel_filter=true
audio_device=default
# Optional B210 external mixer. Default remains direct RF reception, no TX.
mixer_enabled=false
lo_output_enabled=false
if_hz=53000000
# Physical connectors: TRX1/RX1 are UHD channel 0; TRX2/RX2 channel 1.
rx_input=RX1
lo_port=TRX1

# Optional read-only HTTP diagnostics; CLI --status-port overrides this.
[status]
enabled=false
bind=127.0.0.1
port=8877
# Use bind=0.0.0.0 to read /status from other computers on a trusted LAN.

[dvbt2]
plp=-1
# Optional GPU LDPC; CPU remains the default and fallback.
gpu_ldpc=false

# Automatic DVB-T bonding: first channel centered, partner learned at +/-50 kHz.
[dvbt]
disable_bonding=false
