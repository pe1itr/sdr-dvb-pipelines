# Paths containing / are relative to this file. Bare names are searched in PATH.
[paths]
sdr=build/sdr_to_stdout
linrad=build/linrad_udp_to_stdout
leandvb=../leansdr/src/apps/leandvb
# Legacy external Scatterfix path; ignored by the embedded recovery.
scatterfix=../TSscatterfix/tools/contest_live.py
cvlc=cvlc
vlc=vlc
ffplay=ffplay
custom_renderer=mpv
iq_file=/home/rhardenb/repos/sdr-dvb-pipelines/build/iq_file_to_stdout

[linrad]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
ip=127.0.0.1
port=50000
header_bytes=24
sample_rate=1010526
format=s16
# Extra options, e.g. --s16-gain 2 --measure 3200000
# Recording: --record-iq recordings (the GUI keeps stdout enabled).
args=
frequency=0

[leandvb]
dvbs_args=--inbuf 262144 --sampler rrc --rrc-steps 8 --fastlock --hq -v --gui
# Normal acquisition limits CPU work while no signal is present.
# --fastlock searches more aggressively and can overload high-rate reception.
dvbs2_args=--gui --sampler rrc --rrc-steps 8 --ldpc-bf 20 --framesizes 1

[rbdvbt_rx]
# DVB-T is compiled into linrad_dvb; these are decoder options, not a program path.
args=--afc --live-symbols 64 --probe-symbols 64 --wait-video-start --loglevel info

[scatterfix]
# Legacy settings retained for reference; ignored by linrad_dvb.
# Enable the embedded parallel RGB recovery with [session] scatterfix or the GUI.
udp_host=127.0.0.1
udp_port=1235
args=--work-dir ../TSscatterfix/temp/live --model ../TSscatterfix/temp/linrad_fragments_5way_conf/model_combined.json --output-fps 1 --codec auto --output-size 640x360 --startup-interval 0.7 --interval 1 --startup-analysis-packets 20 --analysis-packets 150 --min-packets 20

[cvlc]
args=--no-one-instance --avcodec-hw=none --demux=ts --file-caching=300 --live-caching=300 --network-caching=300 --clock-jitter=0 --clock-synchro=0 --drop-late-frames --skip-frames --no-fullscreen --zoom=1

[ffplay]
args=-hide_banner -loglevel warning -autoexit -f mpegts

# Direct SDR inputs. Press W in the GUI to save settings for the next start.
[hackrf]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=0
tune_step=1000
sample_rate=10000000
frequency=437000000
gain=30
format=u8
args=driver=hackrf
images=
antenna=

[b210]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=50000
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=0
tune_step=1000
sample_rate=10000000
frequency=437000000
gain=30
format=s16
args=
images=/home/rhardenb/repos/ettus/uhd-images
antenna=TX/RX

# RFspace SDR-IQ through SoapyRFSpace; tune to the converter output.
[sdriq]
# IQ filter: total width at -6 dB, no resampling. W saves changes.
filter_enabled=false
filter_bandwidth=49028
# Displayed RF = hardware frequency + LO offset (Hz). Arrow step is also Hz.
lo_offset=116000000
tune_step=1000
sample_rate=111111
frequency=28600000
gain=10
format=s16
args=driver=rfspace,sdr-iq=/dev/ttyUSB0
images=
antenna=

[session]
source=file
standard=DVB-T
sr=333000
fec=2/3
gi=1/32
constellation=QPSK
scatterfix=false
renderer=embedded

[renderer]
args={input}
output_file=capture.ts
udp_enabled=false
udp_host=127.0.0.1
udp_port=1234

[file]
path=/home/rhardenb/repos/datv-transmitter/iq-output/dvbt-qpsk-bw333000-gi1-32-fec2-3-fs1750000-40s-jJlDBc_rx.iq
input_format=s16
format=s16
sample_rate=1750000
header_bytes=0
frequency=144600000
metadata=Metadata: /home/rhardenb/repos/datv-transmitter/iq-output/dvbt-qpsk-bw333000-gi1-32-fec2-3-fs1750000-40s-jJlDBc_rx.iq.json
filter_bandwidth=449550
filter_enabled=false

[display]
floor_dbfs_hz=-125
range_db=85

# Parallel audio monitor: U = USB (3 kHz), F = FM (12.5 kHz), D = FM-DATA (20 kHz).
# M mutes only speakers; TCI and optional PCM UDP audio continue.
[usb]
tci_bind=127.0.0.1
tci_port=40031
audio_device=default
pcm_udp_enabled=false
pcm_udp_host=127.0.0.1
pcm_udp_port=7355
