# Receive-only example for Linrad DVB's optional PCM UDP output.
# Enable "Send PCM audio via UDP" in the TCI menu, destination 127.0.0.1:7355.
# FM + -B 1200 for Bell 202 AFSK; FM-DATA + -B 9600 for G3RUH.
ADEVICE UDP:7355 null
ARATE 48000
ACHANNELS 1
CHANNEL 0
MYCALL N0CALL
MODEM 9600
FIX_BITS 0

# Packet monitoring only; no network TNC services or beacon/IGate settings.
AGWPORT 0
KISSPORT 0
