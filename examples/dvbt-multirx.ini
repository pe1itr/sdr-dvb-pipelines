# Experimental Linux repeater. Paths are relative to THIS file.
# python3 tools/dvbt_multirx.py --config examples/dvbt-multirx.ini
[multirx]
experimental=true
# Bounded IQ fanout backlog PER decoder; overload stops the complete pipeline.
queue_ms=500

[paths]
sdr=../build/sdr_to_stdout
decoder=../build/linrad_dvb

[sdr]
source=rtlsdr
frequency=144550000
sample_rate=2400000
gain=30
args=driver=rtlsdr
# FUNcube Pro+: source=fcdpp, sample_rate=192000, args= (empty).
# Its ALSA/HID selection uses the existing helper's device args syntax.

[channel:144525]
# Experimental pinning of ALL decoder threads to one logical CPU (IDs start at 0).
# Empty or auto restores OS scheduling. Check available IDs on the target host.
cpu_affinity=2
frequency=144525000
bandwidth=40000
fec=1/2
gi=auto
udp_host=127.0.0.1
udp_port=10000

[channel:144575]
cpu_affinity=3
frequency=144575000
bandwidth=40000
fec=1/2
gi=auto
udp_host=127.0.0.1
udp_port=10001
