name: Keep the four newest releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove older published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          ids=$(jq -r 'flatten | map(select(.draft == false)) | sort_by(.published_at, .id) | reverse | .[4:][] | .id' <<< "$releases")
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
